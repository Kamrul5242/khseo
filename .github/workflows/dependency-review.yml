name: dependency review
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # KHSEO is stdlib-only today; this blocks a PR that adds a dependency (or action) with a
    # known vulnerability or a disallowed licence before it lands.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
