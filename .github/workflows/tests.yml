name: tests
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the test job only needs to read the repository.
permissions:
  contents: read

jobs:
  offline-contract-tests:
    # Offline only: structure, schemas, probe, PDF engines, security regressions, and the
    # behavior scenarios' spec anchors. No LLM is called here (see tests/behavior/README.md).
    name: offline contract tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      # Actions are pinned to full commit SHAs (immutable); the comment is the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/run_tests.py
